name: 一鍵安裝測試（手動）

# 僅手動觸發（workflow_dispatch）；不隨 push／PR 執行。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-test:
    name: 安裝測試（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-26.04
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v5

      - name: 還原 Cargo 建置快取
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
            agent/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('backend/Cargo.lock', 'agent/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: 執行一鍵安裝（模擬 curl | bash）
        run: |
          sudo env CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
            bash -s -- --source-dir "$GITHUB_WORKSPACE" --kea-subnet 198.51.100.0/24 \
            < deploy/install.sh

      - name: 驗證服務與 Kea 保留 roundtrip
        run: |
          systemctl is-active --quiet nginx
          systemctl is-active --quiet asset-nest
          systemctl is-active --quiet isc-kea-dhcp4-server
          curl -fsS http://127.0.0.1/api/health
          sudo grep '^KEA_' /etc/asset-nest/asset-nest.env > "$GITHUB_WORKSPACE/.env"
          cd "$GITHUB_WORKSPACE"
          sudo env CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
            PATH="$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin" \
            pnpm test:kea

      - name: 執行代理安裝（自來源建置、大掃描間隔避免真實掃描）
        run: |
          AUTH_CODE="$(sudo grep '^AGENT_AUTH_CODE=' /etc/asset-nest/asset-nest.env | cut -d= -f2-)"
          test -n "$AUTH_CODE"
          # 明確指定預設路由介面的網段：runner 可能有多個非 loopback 介面
          # （如 docker0），代理的自動偵測遇多候選會拒絕啟動。
          ROUTE_DEV="$(ip -4 route show default | awk '{print $5; exit}')"
          SUBNET="$(ip -4 -o addr show scope global dev "$ROUTE_DEV" | awk 'NR == 1 {print $4}')"
          test -n "$SUBNET"
          sudo env CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
            bash -s -- --source-dir "$GITHUB_WORKSPACE" \
            --server-url http://127.0.0.1 --auth-code "$AUTH_CODE" \
            --subnet "$SUBNET" --sweep-interval 86400 < deploy/agent-install.sh

      - name: 驗證代理服務、環境檔權限與心跳上線
        run: |
          systemctl is-active asset-nest-agent
          test "$(sudo stat -c '%a:%U:%G' /etc/asset-nest-agent/agent.env)" = "640:root:asset-nest-agent"
          INSTANCE_ID="$(sudo grep '^AGENT_INSTANCE_ID=' /etc/asset-nest-agent/agent.env | cut -d= -f2-)"
          test -n "$INSTANCE_ID"
          # /api/v1/agents 受登入保護（見 docs/adr/0021）：先以安裝產生的帳密
          # 登入取 cookie，後續查詢帶 cookie（登入失敗 curl -f 即中止）。
          PW="$(sudo grep '^AUTH_PASSWORD=' /etc/asset-nest/asset-nest.env | cut -d= -f2-)"
          curl -fsS -c /tmp/an-cookies -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$PW\"}" \
            -X POST http://127.0.0.1/api/v1/login >/dev/null
          for attempt in $(seq 1 12); do
            if curl -fsS -b /tmp/an-cookies http://127.0.0.1/api/v1/agents \
              | jq -e --arg id "$INSTANCE_ID" 'any(.items[]; .instance_id == $id and .online)' >/dev/null; then
              echo "代理 $INSTANCE_ID 已在線。"
              exit 0
            fi
            sleep 5
          done
          echo "等待代理上線逾時（instance id：$INSTANCE_ID）。" >&2
          curl -fsS -b /tmp/an-cookies http://127.0.0.1/api/v1/agents || true
          exit 1

      - name: 重跑代理安裝（重跑＝更新；保留 instance id 與認證碼）
        run: |
          INSTANCE_ID_BEFORE="$(sudo grep '^AGENT_INSTANCE_ID=' /etc/asset-nest-agent/agent.env | cut -d= -f2-)"
          sudo env CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
            bash -s -- --source-dir "$GITHUB_WORKSPACE" --sweep-interval 86400 \
            --server-url http://127.0.0.1 < deploy/agent-install.sh
          systemctl is-active --quiet asset-nest-agent
          test "$(sudo grep '^AGENT_INSTANCE_ID=' /etc/asset-nest-agent/agent.env | cut -d= -f2-)" = "$INSTANCE_ID_BEFORE"
          test "$(sudo grep '^AGENT_AUTH_CODE=' /etc/asset-nest-agent/agent.env | cut -d= -f2-)" \
            = "$(sudo grep '^AGENT_AUTH_CODE=' /etc/asset-nest/asset-nest.env | cut -d= -f2-)"

      - name: 失敗時輸出服務紀錄
        if: failure()
        run: |
          sudo journalctl -u asset-nest --no-pager -n 200 || true
          sudo journalctl -u asset-nest-agent --no-pager -n 200 || true
          sudo journalctl -u isc-kea-dhcp4-server --no-pager -n 200 || true
